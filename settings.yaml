# ===== Threadsアフィリエイト自動化 設定 =====

# --- 3. ジャンル・商品選定 ---
research:
  # web: Claudeのネット検索で、楽天ランキング・Amazon・@cosme・LIPS・ブログなどを横断して調べる（API登録不要）
  # rakuten_api: 楽天APIのランキングだけを使う（RAKUTEN_APP_ID が必要）
  source: web
  # 楽天ジャンルID（例: 100939=美容・コスメ・香水, 215783=日用品雑貨, 100227=食品）
  # https://webservice.rakuten.co.jp/explorer/api/IchibaGenre/Search で確認できます
  genres:
    - id: 100939
      name: 美容・コスメ・香水
  ranking_top_n: 30          # ランキング1〜30位をチェック
  min_affiliate_rate: 10.0   # 料率10%以上
  threads_min_likes: 100     # 「いいね100以上」の投稿が
  threads_min_hit_posts: 10  # 10個以上あるか
  pick_count: 5              # 5商品に絞る

# --- 読者像（AIへの質問の前提）---
persona: 30代の母親。忙しくて自分のケアは後回しになりがち。

# --- 4. 投稿生成 ---
generation:
  model: claude-opus-5-5
  drafts_per_product: 3      # 「この型で3つ作って」
  # Threadsで伸びている投稿の「型」。伸びている投稿を見つけたら、ここに追加する
  templates:
    - name: 生々しい一言
      structure: |
        1行目: 読者の心の声をそのまま書く（例: 「冬になると手がガサガサで、子どもに触るのが痛い」）
        2〜3行目: 自分も同じだった、という共感
        4行目以降: これに変えてから変わったこと（1つだけ）
        最後: 「リンクはリプ欄に置いておきます」
    - name: 比較・失敗談
      structure: |
        1行目: 「〇〇で3回失敗した私が、やっと見つけたもの」
        中盤: 失敗した理由を箇条書きで2〜3個
        最後: これは〇〇だから続いた、の一言
    - name: 質問フック
      structure: |
        1行目: 「〇〇な人、いませんか？」
        中盤: 悩みを具体的な場面で描写する
        最後: 解決した商品を1つだけ紹介する

# --- 5. 運用 ---
posting:
  # manual: Threads APIを使わない。毎朝「投稿シート」を作るので、Threadsアプリの予約投稿に貼る
  # auto:   Threads APIで自動投稿する（THREADS_ACCESS_TOKEN が必要）
  mode: manual
  manual_times: ["07:30", "12:15", "21:00", "19:30", "20:30", "22:30"]  # 投稿シートに書く目安の時刻
  daily_limit: 3             # 毎日大量に投稿しない
  sale_daily_limit: 6        # セールの前日・開始日・終了日は増やす
  require_approval: true     # 人が承認したものだけ投稿する
  require_personal_note: true  # 自分の体験の一言（personal_note）がない下書きは投稿しない
  link_in_reply: true        # 本文にはリンクを入れず、リプ欄にリンクを置く
  pr_label: "【PR】"          # ステマ規制への対応。消さないこと
  timezone: Asia/Tokyo

# 過去の当たり投稿を「擦る」
reuse:
  min_views: 3000            # この閲覧数以上の投稿を「当たり」とみなす
  variants_per_hit: 2
  cooldown_days: 14          # 同じ当たり投稿を擦る間隔

# 楽天セール。日付は公式発表に合わせて更新する
sales:
  - name: 楽天スーパーSALE
    start: 2026-12-04T20:00
    end: 2026-12-11T01:59
  - name: お買い物マラソン
    start: 2026-12-19T20:00
    end: 2026-12-26T01:59
