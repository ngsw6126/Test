name: 2. 下書き生成と投稿シート（毎日）
on:
  schedule:
    - cron: "0 21 * * *"  # 毎朝 6:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-update
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m threads_affiliate generate
      # 手動投稿モードのとき: 承認済みの下書きを、今日のコピペ用シートに書き出す
      - run: |
          if grep -qE '^\s*mode:\s*manual' settings.yaml; then python -m threads_affiliate export; fi
      - run: .github/workflows/_commit.sh "投稿の下書きを追加"
