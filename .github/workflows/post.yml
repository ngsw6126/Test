name: 3. 自動投稿
on:
  schedule:
    # 通常の投稿枠（JST 7:30 / 12:15 / 21:00）
    - cron: "30 22 * * *"
    - cron: "15 3 * * *"
    - cron: "0 12 * * *"
    # セールの前日・開始日・終了日だけ使う追加枠（JST 19:30 / 20:30 / 22:30）
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに内容だけ確認する"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: data-update
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 投稿
        run: |
          ARGS=""
          case "${{ github.event.schedule }}" in
            "30 10 * * *"|"30 11 * * *"|"30 13 * * *") ARGS="--sale-only" ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m threads_affiliate post $ARGS
      - run: .github/workflows/_commit.sh "投稿を記録"
